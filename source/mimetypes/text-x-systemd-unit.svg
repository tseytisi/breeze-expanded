<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <style type="text/css">
        .coloursymbol {
            color: #edfaed;
            stop-color: currentColor;
            fill: currentColor;
        }
        .coloursymbol-stroke {
            color: #edfaed;
            fill: none;
            stroke: currentColor;
            stroke-width: 1px;
        }
        .body-light {
            color: #53da8a;
            stop-color: currentColor;
        }
        .body-dark {
            color: #33d374;
            stop-color: currentColor;
        }
        .symbolic {
            color: #33d374;
            fill: currentColor;
        }
        .symbolic-stroke {
            color: #33d374;
            fill: none;
            stroke: currentColor;
            stroke-width: 1px;
        }
        .highlight {
            color: #ffffff;
            stop-color: currentColor;
            opacity: .4;
            stop-opacity: .4;
            fill: currentColor;
        }
        .shadow {
            color: #000000;
            stop-color: currentColor;
            opacity: .25;
            stop-opacity: .25;
            fill: currentColor;
        }
    </style>
    <symbol id="icon64" viewBox="0 0 64 64">
        <defs>
            <linearGradient id="body-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="coloursymbol" stop-opacity="0.5" />
                <stop offset="1" class="coloursymbol" />
            </linearGradient>
            <linearGradient id="flap-shadow" x1="0" x2="1" y1="0" y2="0">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient)" d="M 10 3 H 40 L 54 17 V 61 H 10 Z" />
        <rect class="highlight" x="10" y="3" width="30" height="1" />
        <rect class="shadow" x="10" y="60" width="44" height="1" />
        <g>
            <path fill="url(#flap-gradient)" d="M 54 17 l -14 -14 v 14 z" />
            <path opacity=".15" fill="url(#flap-shadow)" d="M 40 17 l 14 14 v -14 z"/>
        </g>
        <!-- 22x22 -->
        <g transform="translate(21 22)">
            <path class="coloursymbol-stroke" d="
                M 3 6.5 h -2.5 v 9 h 2.5
            " />
            <circle cx="7" cy="11" r="3" class="coloursymbol" />
            <path class="coloursymbol" d="
                M 12 11 l 5.5 -3 v 6 z
            " />
            <path class="coloursymbol-stroke" d="
                M 19 6.5 h 2.5 v 9 h -2.5
            " />
        </g>
    </symbol>
    <symbol id="icon32" viewBox="0 0 32 32">
        <defs>
            <linearGradient id="body-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="coloursymbol" stop-opacity="0.9" />
                <stop offset="1" class="coloursymbol" />
            </linearGradient>
            <linearGradient id="flap-shadow32" x1="0" x2="1" y1="0" y2="0">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient32)" d="M 5 2 H 20 L 27 9 V 30 H 5 Z" />
        <rect class="highlight" x="5" y="2" width="15" height="1" />
        <rect class="shadow" x="5" y="29" width="22" height="1" />
        <g>
            <path fill="url(#flap-gradient32)" d="M 27 9 l -7 -7 v 7 z" />
            <path opacity=".15" fill="url(#flap-shadow32)" d="M 20 9 l 7 7 v -7 z"/>
        </g>
        <!-- 12x12 -->
        <g transform="translate(10 11)">
            <path class="coloursymbol-stroke" d="
                M 3 2.5 h -2.5 v 7 h 2.5
            " />
            <circle cx="4" cy="6" r="2" class="coloursymbol" />
            <path class="coloursymbol" d="
                M 6.5 6 l 3.5 -2 v 4 z
            " />
            <path class="coloursymbol-stroke" d="
                M 9 2.5 h 2.5 v 7 h -2.5
            " />
        </g>
    </symbol>
    <symbol id="icon22" viewBox="0 0 22 22">
        <!-- 16x16 -->
        <g transform="translate(3 3)">
            <path class="symbolic-stroke" d="
                M 3 4.5 h -2.5 v 7 h 2.5
            " />
            <circle cx="5.5" cy="8" r="2" class="symbolic" />
            <path class="symbolic" d="
                M 8.5 8 l 3.5 -2 v 4 z
            " />
            <path class="symbolic-stroke" d="
                M 13 4.5 h 2.5 v 7 h -2.5
            " />
        </g>
    </symbol>
    <symbol id="icon16" viewBox="0 0 16 16">
        <!-- 12x12 -->
        <g transform="translate(2 2)">
            <path class="symbolic-stroke" d="
                M 3 2.5 h -2.5 v 7 h 2.5
            " />
            <circle cx="4" cy="6" r="2" class="symbolic" />
            <path class="symbolic" d="
                M 6.5 6 l 3.5 -2 v 4 z
            " />
            <path class="symbolic-stroke" d="
                M 9 2.5 h 2.5 v 7 h -2.5
            " />
        </g>
    </symbol>
    <!-- #include /common.xml -->
    <!-- <rect x="0" y="0" width="64" height="64" fill="#000000" /> -->
    <use href="#icon64" />
    <!-- <use href="#border64" /> -->
    <!-- <use href="#icon32" /> -->
    <!-- <use href="#border32" /> -->
    <!-- <use href="#icon22" /> -->
    <!-- <use href="#border22" /> -->
    <!-- <use href="#icon16" /> -->
    <!-- <use href="#border16" /> -->
    <!-- <use href="#grid" /> -->
</svg>
