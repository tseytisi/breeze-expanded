<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <style type="text/css">
        .coloursymbol {
            color: #787878;
            stop-color: currentColor;
        }
        .fill {
            fill: currentColor;
        }
        .stroke {
            fill: none;
            stroke: currentColor;
            stroke-width: 1px;
        }
        .body-light {
            color: #d6d6d6;
            stop-color: currentColor;
        }
        .body-dark {
            color: #cccccc;
            stop-color: currentColor;
        }
        .symbolic {
            color: #eeeeee;
            /* variant: light */
            /* color: #747474;  */
        }
        .highlight {
            color: #ffffff;
            stop-color: currentColor;
            opacity: .4;
            stop-opacity: .4;
            fill: currentColor;
        }
        .shadow {
            color: #000000;
            stop-color: currentColor;
            opacity: .25;
            stop-opacity: .25;
            fill: currentColor;
        }
    </style>
    <symbol id="icon64" viewBox="0 0 64 64">
        <defs>
            <linearGradient id="body-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="highlight" stop-opacity="0.9" />
                <stop offset="1" class="highlight" />
            </linearGradient>
            <!-- Diagonal shadow -->
            <linearGradient id="flap-shadow" x1="0" x2="1" y1="0" y2="1">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient)" d="M 10 3 H 40 L 54 17 V 61 H 10 Z" />
        <rect class="highlight" x="10" y="3" width="30" height="1" />
        <rect class="shadow" x="10" y="60" width="44" height="1" />
        <g>
            <path fill="url(#flap-gradient)" d="M 54 17 l -14 -14 v 14 z" />
            <path opacity="0.15" fill="url(#flap-shadow)" d="M 40 17 l 14 14 v -14 z"/>
        </g>
        <!-- 22x22 -->
        <g transform="translate(21 22)">
            <rect class="coloursymbol fill" x="3" y="11" width="16" height="10" />
            <path class="coloursymbol stroke" d="
                M 6.5 12 v -5
                q 0 -4.5 4.5 -4.5
                q 4.5 0 4.5 4.5
                v 5
            " />
        </g>
    </symbol>
    <symbol id="icon32" viewBox="0 0 32 32">
        <defs>
            <linearGradient id="body-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="highlight" stop-opacity="0.9" />
                <stop offset="1" class="highlight" />
            </linearGradient>
            <linearGradient id="flap-shadow32" x1="0" x2="1" y1="0" y2="1">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient32)" d="M 5 2 H 20 L 27 9 V 30 H 5 Z" />
        <rect class="highlight" x="5" y="2" width="15" height="1" />
        <rect class="shadow" x="5" y="29" width="22" height="1" />
        <g>
            <path fill="url(#flap-gradient32)" d="M 27 9 l -7 -7 v 7 z" />
            <path opacity=".15" fill="url(#flap-shadow32)" d="M 20 9 l 7 7 v -7 z"/>
        </g>
        <!-- 12x12 -->
        <g transform="translate(10 11)">
            <rect class="coloursymbol fill" x="1" y="6" width="10" height="6" />
            <path class="coloursymbol stroke" d="
                M 3.5 7 v -4
                q 0 -2.5 2.5 -2.5
                q 2.5 0 2.5 2.5
                v 4
            " />
        </g>
    </symbol>
    <symbol id="icon22" viewBox="0 0 22 22">
        <!-- 16x16 -->
        <g class="symbolic" transform="translate(3 3)">
            <rect class="symbolic fill" x="1" y="8" width="14" height="8" />
            <path class="symbolic stroke" d="
                M 4.5 9 v -5
                q 0 -3.5 3.5 -3.5
                q 3.5 0 3.5 3.5
                v 5
            " />
        </g>
    </symbol>
    <symbol id="icon16" viewBox="0 0 16 16">
        <!-- 12x12 -->
        <g transform="translate(2 2)">
            <rect class="symbolic fill" x="1" y="6" width="10" height="6" />
            <path class="symbolic stroke" d="
                M 3.5 7 v -4
                q 0 -2.5 2.5 -2.5
                q 2.5 0 2.5 2.5
                v 4
            " />
        </g>
    </symbol>
    <symbol id="grid">
        <path
            stroke="#777777" stroke-width="0.05px"
            d="M 1 0 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64 m 1 -64 V 64"
            />
        <path
            stroke="#777777" stroke-width="0.05px"
            d="M 0 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64 m -64 1 H 64"
            />
    </symbol>
    <symbol id="border64">
        <rect stroke="#ff00ff" fill="none" stroke-width="1px" x="21" y="22" width="23" height="23" transform="translate(-.5 -.5)" />
    </symbol>
    <symbol id="border32">
        <rect stroke="#ff00ff" fill="none" stroke-width="1px" x="10" y="11" width="13" height="13" transform="translate(-.5 -.5)" />
    </symbol>
    <symbol id="border22" viewBox="0 0 22 22">
        <rect stroke="#ff00ff" fill="none" stroke-width="1px" x="3" y="3" width="17" height="17" transform="translate(-.5 -.5)" />
    </symbol>
    <symbol id="border16">
        <rect stroke="#ff00ff" fill="none" stroke-width="1px" x="2" y="2" width="13" height="13" transform="translate(-.5 -.5)" />
    </symbol>
