    <style type="text/css">
        .coloursymbol {
            color: #747474;
            stop-color: currentColor;
            fill: currentColor;
        }
        .body-light {
            color: #f1f1f1;
            stop-color: currentColor;
        }
        .body-dark {
            color: #eeeeee;
            stop-color: currentColor;
        }
        .symbolic {
            /* Breeze dark */
            color: #eeeeee;
            /* Breeze light */
            /* color: #747474;  */
            fill: currentColor;
        }
        .highlight {
            color: #ffffff;
            stop-color: #ffffff;
            opacity: .3;
            stop-opacity: .3;
            fill: currentColor;
        }
        .shadow {
            color: #000000;
            stop-color: #000000;
            opacity: .25;
            stop-opacity: .25;
            fill: currentColor;
        }
    </style>
