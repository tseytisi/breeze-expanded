<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <style type="text/css">
        .coloursymbol {
            color: #747474;
            stop-color: currentColor;
            fill: currentColor;
        }
        .body-light {
            color: #f1f1f1;
            stop-color: currentColor;
        }
        .body-dark {
            color: #eeeeee;
            stop-color: currentColor;
        }
        .symbolic {
            fill: currentColor;
            color: #eeeeee;
            /* variant: light */
            /* color: #747474;  */
        }
        .highlight {
            color: #ffffff;
            stop-color: #ffffff;
            opacity: .3;
            stop-opacity: .3;
            fill: currentColor;
        }
        .shadow {
            color: #000000;
            stop-color: #000000;
            opacity: .25;
            stop-opacity: .25;
            fill: currentColor;
        }
    </style>
    <symbol id="icon64" viewBox="0 0 64 64">
        <defs>
            <linearGradient id="body-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="coloursymbol" stop-opacity="0.9" />
                <stop offset="1" class="coloursymbol" />
            </linearGradient>
            <linearGradient id="flap-shadow" x1="0" x2="1" y1="0" y2="0">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient)" d="M 10 3 H 40 L 54 17 V 61 H 10 Z" />
        <rect class="highlight" x="10" y="3" width="30" height="1" />
        <rect class="shadow" x="10" y="60" width="44" height="1" />
        <g>
            <path fill="url(#flap-gradient)" d="M 54 17 l -14 -14 v 14 z" />
            <path opacity=".15" fill="url(#flap-shadow)" d="M 40 17 l 14 14 v -14 z"/>
        </g>
        <!-- 22x22 -->
        <g class="coloursymbol" transform="translate(22 23)">
            <rect x="0" y="0" width="5" height="5" />
            <rect x="7" y="0" width="5" height="5" />
            <rect x="14" y="0" width="5" height="5" />
            <rect x="0" y="7" width="5" height="5" />
            <rect x="7" y="7" width="5" height="5" />
            <rect x="14" y="7" width="5" height="5" />
            <rect x="0" y="14" width="5" height="5" />
            <rect x="7" y="14" width="5" height="5" />
            <rect x="15" y="15" width="5" height="5" />
        </g>
    </symbol>
    <symbol id="icon32" viewBox="0 0 32 32">
        <defs>
            <linearGradient id="body-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="coloursymbol" stop-opacity="0.9" />
                <stop offset="1" class="coloursymbol" />
            </linearGradient>
            <linearGradient id="flap-shadow32" x1="0" x2="1" y1="0" y2="0">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient32)" d="M 5 2 H 20 L 27 9 V 30 H 5 Z" />
        <rect class="highlight" x="5" y="2" width="15" height="1" />
        <rect class="shadow" x="5" y="29" width="22" height="1" />
        <g>
            <path fill="url(#flap-gradient32)" d="M 27 9 l -7 -7 v 7 z" />
            <path opacity=".15" fill="url(#flap-shadow32)" d="M 20 9 l 7 7 v -7 z"/>
        </g>
        <!-- 12x12 -->
        <g class="coloursymbol" transform="translate(10 11)">
            <rect x="0" y="0" width="5" height="5" />
            <rect x="6" y="0" width="5" height="5" />
            <rect x="0" y="6" width="5" height="5" />
            <rect x="7" y="7" width="5" height="5" />
        </g>
    </symbol>
    <symbol id="icon22" viewBox="0 0 22 22">
        <!-- 16x16 -->
        <g class="symbolic" transform="translate(4 4)">
            <rect x="0" y="0" width="4" height="4" />
            <rect x="5" y="0" width="4" height="4" />
            <rect x="10" y="0" width="4" height="4" />
            <rect x="0" y="5" width="4" height="4" />
            <rect x="5" y="5" width="4" height="4" />
            <rect x="10" y="5" width="4" height="4" />
            <rect x="0" y="10" width="4" height="4" />
            <rect x="5" y="10" width="4" height="4" />
            <rect x="11" y="11" width="4" height="4" />
        </g>
    </symbol>
    <symbol id="icon16" viewBox="0 0 16 16">
        <!-- 12x12 -->
        <g class="symbolic" transform="translate(2 2)">
            <rect x="0" y="0" width="5" height="5" />
            <rect x="6" y="0" width="5" height="5" />
            <rect x="0" y="6" width="5" height="5" />
            <rect x="7" y="7" width="5" height="5" />
        </g>
    </symbol>
    <!-- #include /common.xml -->
    <!-- <rect title="background" x="0" y="0" width="64" height="64" fill="#000000" /> -->
    <use href="#icon64" />
    <!-- <use href="#icon32" /> -->
    <!-- <use href="#icon22" /> -->
    <!-- <use href="#icon16" /> -->
    <!-- <use href="#grid" /> -->
</svg>
