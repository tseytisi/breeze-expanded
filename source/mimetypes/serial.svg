<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <style type="text/css">
        .coloursymbol {
            color: #d7d7d7;
            stop-color: currentColor;
            fill: none;
            stroke: currentColor;
            stroke-width: 1px;
        }
        .body-light {
            color: #6e6e6e;
            stop-color: currentColor;
        }
        .body-dark {
            color: #555555;
            stop-color: currentColor;
        }
        .symbolic {
            color: #6c7a89; 
            fill: none;
            stroke: currentColor;
            stroke-width: 1px;
        }
        .highlight {
            color: #a8a8a8;
            stop-color: #a8a8a8;
            fill: currentColor;
        }
        .shadow {
            color: #373737;
            stop-color: #373737;
            fill: currentColor;
        }
    </style>
    <symbol id="icon64" viewBox="0 0 64 64">
        <defs>
            <linearGradient id="body-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient" x1="0" x2="0" y1="0" y2="1">
                <stop class="highlight" />
                <stop offset="1" class="coloursymbol" />
            </linearGradient>
            <linearGradient id="flap-shadow" x1="0" x2="1" y1="0" y2="0">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient)" d="M 10 3 H 40 L 54 17 V 61 H 10 Z" />
        <rect class="highlight" x="10" y="3" width="30" height="1" />
        <rect class="shadow" x="10" y="60" width="44" height="1" />
        <g>
            <path fill="url(#flap-gradient)" d="M 54 17 l -14 -14 v 14 z" />
            <path opacity=".25" fill="url(#flap-shadow)" d="M 40 17 l 14 14 v -14 z"/>
        </g>
        <!-- Icon is 22x22, centred -->
        <!-- Content margin (x) = 10px; content padding (x) = 11px; -->
        <path
            transform="translate(20.5 21.5)"
            class="coloursymbol"
            d="M -.5 8 h.5 h4v-4h4v4h5v-4h4v4h4.5
             M -.5 13 h.5 h4v4h4v-4h5v4h4v-4h4.5
             "
            />
    </symbol>
    <symbol id="icon32" viewBox="0 0 32 32">
        <defs>
            <linearGradient id="body-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="body-light" />
                <stop offset="1" class="body-dark" />
            </linearGradient>
            <linearGradient id="flap-gradient32" x1="0" x2="0" y1="0" y2="1">
                <stop class="highlight" />
                <stop offset="1" class="coloursymbol" />
            </linearGradient>
            <linearGradient id="flap-shadow32" x1="0" x2="1" y1="0" y2="0">
                <stop stop-color="#000000"/>
                <stop offset="1" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path fill="url(#body-gradient32)" d="M 5 2 H 20 L 27 9 V 30 H 5 Z" />
        <rect class="highlight" x="5" y="2" width="15" height="1" />
        <rect class="shadow" x="5" y="29" width="22" height="1" />
        <g>
            <path fill="url(#flap-gradient32)" d="M 27 9 l -7 -7 v 7 z" />
            <path opacity=".25" fill="url(#flap-shadow32)" d="M 20 9 l 7 7 v -7 z"/>
        </g>
        <!-- Icon is 12x12, (vertical is one pixel below centre) -->
        <!-- Content margin (x) = 5px; content padding (x) = 5px; -->
        <path
            transform="translate(10.5 10.5)"
            class="coloursymbol"
            d="M-.5 5 h1.5v-3h3v3h3v-3h3v3h1.5
             M-.5 8 h1.5v3h3v-3h3v3h3v-3h1.5
             "
            />
    </symbol>
    <symbol id="icon22" viewBox="0 0 22 22">
        <!-- 3px margins -> 16x16 -->
        <path
            transform="translate(3.5 3.5)"
            class="symbolic"
            d="M-.5 5 h2.5v-3h4v3h3v-3h4v3h2.5
             M-.5 10 h2.5v3h4v-3h3v3h4v-3h2.5
             "
            />
    </symbol>
    <symbol id="icon16" viewBox="0 0 16 16">
        <!-- 2px margins -> 12x12 -->
        <path
            transform="translate(2.5 1.5)"
            class="symbolic"
            d="M-.5 5 h1.5v-3h3v3h3v-3h3v3h1.5
             M-.5 8 h1.5v3h3v-3h3v3h3v-3h1.5
             "
            />
    </symbol>
    <use href="#icon64" />
    <!-- <use href="#icon32" /> -->
    <!-- <use href="#icon22" /> -->
    <!-- <use href="#icon16" /> -->
</svg>
