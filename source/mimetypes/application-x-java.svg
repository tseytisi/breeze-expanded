    <style type="text/css">
        .coloursymbol {
            color: #5b3b1e;
            stop-color: currentColor;
            fill: currentColor;
        }
        .coloursymbol-stroke {
            color: #5b3b1e;
            fill: none;
            stroke: currentColor;
            stroke-width: 1px;
        }
        .coloursymbol-colour {
            color: #5e3b1e;
        }
        .body-light {
            color: #ffa24f;
            stop-color: currentColor;
        }
        .body-dark {
            color: #ff8b23;
            stop-color: currentColor;
        }
        .symbolic {
            color: #f27935;
            fill: currentColor;
        }
        .symbolic-stroke {
            color: #f27935;
            fill: none;
            stroke: currentColor;
            stroke-width: 1px;
        }
        .highlight {
            color: #ffffff;
            stop-color: #ffffff;
            opacity: .3;
            stop-opacity: .3;
            fill: currentColor;
        }
        .shadow {
            color: #000000;
            stop-color: #000000;
            opacity: .25;
            stop-opacity: .25;
            fill: currentColor;
        }
        /* This icon is very weird; I tried to match it to text-x-java as close as possible */
        .flap-top {
            stop-color: #85603e;
        }
        .flap-bottom {
            stop-color: #7e5734;
        }
    </style>
